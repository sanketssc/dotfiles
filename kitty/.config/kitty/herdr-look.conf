# Look modeled on owainlewis/dotfiles ghostty config (used in his herdr video).
# Disable: comment out the `include herdr-look.conf` line at the end of kitty.conf.

# his font (owainlewis dotfiles)
font_family      Monaspace Radon
font_size        15.0
modify_font      cell_height 100%

# deep near-black, nearly opaque, light blur
background          #080b10
background_opacity  0.98
background_blur     20

# breathing room: top right bottom left (pt)
window_padding_width 4 16 12 16

# steady block cursor, copy on select
cursor_shape          block
cursor_blink_interval 0
copy_on_select        clipboard
