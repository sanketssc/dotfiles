include ~/.config/kitty/themes/black_metal_gorgoroth.conf

allow_remote_control yes

map super+u           set_background_opacity 1
map super+shift+u     set_background_opacity default
map super+shift+i     set_background_opacity 0.9

# font_family Monaspace Radon
# font_family Iosevka Nerd Font Mono
font_size 17.46
text_composition_strategy legacy
modify_font cell_width 95%

shell_integration no-cursor
enable_audio_bell no

dynamic_background_opacity yes
hide_window_decorations yes
window_padding_width 0
# window_margin_width 22 0 0 0
background_blur 10
placement_strategy top

cursor_trail 10
cursor_trail_start_threshold 0
shell_integration no-cursor
cursor_trail_decay 0.1 0.3
cursor_shape block

mouse_hide_wait -1.0

background_opacity 0.8
# background_opacity 0.2



# tmux lacks the kitty keyboard protocol and kitty ignores modifyOtherKeys, so shift+enter
# reaches tmux as bare \r. Hand tmux an explicit CSI-u shift+enter while it is focused.
map --when-focus-on title:^tmux: shift+enter send_text all \x1b[13;2u

# macOS text navigation, sent as keys the shell already binds:
# option+arrows = word left/right (ctrl+left/right), cmd+arrows = line start/end (ctrl+a/ctrl+e),
# option+delete = delete word (ctrl+w), cmd+delete = delete to line start (ctrl+u).
# No ESC-prefixed sequences (alt+b/alt+f): nushell runs in vi mode, where ESC drops to normal mode.
# Works through herdr in nushell (vi insert), Claude Code and nvim insert mode.
map alt+left        send_text all \x1b[1;5D
map alt+right       send_text all \x1b[1;5C
map cmd+left        send_text all \x01
map cmd+right       send_text all \x05
map alt+backspace   send_text all \x17
map cmd+backspace   send_text all \x15

# herdr look (see herdr-look.conf)
include herdr-look.conf

# per-machine overrides (new Mac: XDG env + nushell); generated by install-core.sh, not tracked
globinclude local.conf
