id = "local.tab-numbers"
name = "Tab numbers"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Name every tab after its position in its workspace (1, 2, 3...)"
platforms = ["macos", "linux"]

[[startup]]
command = ["sh", "renumber.sh"]

[[events]]
on = "tab.created"
command = ["sh", "renumber.sh"]

[[events]]
on = "tab.closed"
command = ["sh", "renumber.sh"]

[[events]]
on = "tab.moved"
command = ["sh", "renumber.sh"]

[[events]]
on = "tab.renamed"
command = ["sh", "renumber.sh"]
